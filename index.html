<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Bluetooth Respiratory Monitor</title>

  <style>
    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      margin: 16px;
      background: #ffffff;
      color: #111;
    }

    h2 {
      margin-bottom: 6px;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }

    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 14px 16px;
    }

    .big {
      font-size: 28px;
      font-weight: 700;
    }

    .muted {
      color: #666;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      max-width: 900px;
    }

    @media (min-width: 900px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    canvas {
      width: 100%;
      height: 300px;
      display: block;
    }

    code {
      background: #f6f6f6;
      padding: 2px 6px;
      border-radius: 6px;
    }

    #rawBytes {
      font-family: monospace;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <!-- Controls -->
  <div class="row">

    <button id="btnConnect">
      Connect
    </button>

    <button id="btnDisconnect" disabled>
      Disconnect
    </button>

    <button id="btnClear" disabled>
      Clear Plot
    </button>

    <span id="status" class="muted">
      Idle.
    </span>

  </div>


  <!-- Data display -->
  <div class="grid">

    <!-- Raw uint16 -->
    <div class="card">

      <div class="muted">
        Raw uint16 value
      </div>

      <div class="big">
        <span id="rawValue">--</span>
      </div>

      <div class="muted">
        Last update:
        <span id="time">--</span>
      </div>

      <div class="muted">
        Points kept:
        <span id="numPoints">0</span>
      </div>

    </div>

  </div>


  <!-- Plot -->
  <div
    class="card"
    style="margin-top: 12px; max-width: 900px;"
  >

    <div class="muted" style="margin-bottom: 8px;">
      Raw uint16 vs. time
    </div>

    <canvas id="plot"></canvas>

  </div>


  <script>

    // ============================================================
    // BLE UUIDs
    // ============================================================

    const ENV_SVC = 0x181A;
    const HUM_CHR = 0x2A6F;


    // ============================================================
    // UI elements
    // ============================================================

    const btnConnect =
      document.getElementById("btnConnect");

    const btnDisconnect =
      document.getElementById("btnDisconnect");

    const btnClear =
      document.getElementById("btnClear");

    const statusEl =
      document.getElementById("status");

    const rawValueEl =
      document.getElementById("rawValue");

    const timeEl =
      document.getElementById("time");

    const numPointsEl =
      document.getElementById("numPoints");


    // ============================================================
    // Plot
    // ============================================================

    const canvas =
      document.getElementById("plot");

    const ctx =
      canvas.getContext("2d");


    // Keep last 5 minutes
    const KEEP_SECONDS = 300;

    let t0 = null;

    // Each item:
    //
    // {
    //   t: time in seconds,
    //   y: raw uint16 value
    // }
    //
    let data = [];


    // ============================================================
    // BLE handles
    // ============================================================

    let device = null;
    let server = null;
    let humChar = null;


    // Store notification callback
    // so that removeEventListener() works correctly.
    let notificationHandler = null;


    // ============================================================
    // Utility functions
    // ============================================================

    function setStatus(message) {
      statusEl.textContent = message;
    }


    function nowStr() {

      const d = new Date();

      return d.toLocaleTimeString();

    }


    // Convert received bytes to hexadecimal string.
    //
    // Example:
    //
    // [0x85, 0x13]
    //
    // becomes
    //
    // "0x85 0x13"
    //
    function bytesToHex(dataView) {

      const bytes = new Uint8Array(
        dataView.buffer,
        dataView.byteOffset,
        dataView.byteLength
      );

      return Array
        .from(bytes)
        .map(
          byte =>
            "0x" +
            byte
              .toString(16)
              .padStart(2, "0")
              .toUpperCase()
        )
        .join(" ");

    }


    // ============================================================
    // Raw BLE decoding
    // ============================================================

    function parseRawUint16(dataView) {

      // 0x2A6F payload is read as:
      //
      // uint16
      // little-endian
      //
      // IMPORTANT:
      //
      // There is NO division by 100 here.
      //
      // We are keeping the transmitted raw integer.

      return dataView.getUint16(
        0,
        true
      );

    }


    // ============================================================
    // Canvas handling
    // ============================================================

    function resizeCanvas() {

      const dpr =
        window.devicePixelRatio || 1;

      const rect =
        canvas.getBoundingClientRect();

      canvas.width =
        Math.floor(rect.width * dpr);

      canvas.height =
        Math.floor(rect.height * dpr);

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      drawPlot();

    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    // ============================================================
    // Plot drawing
    // ============================================================

    function drawPlot() {

      const w =
        canvas.getBoundingClientRect().width;

      const h =
        canvas.getBoundingClientRect().height;


      // Clear canvas
      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      // Plot padding
      const padL = 65;
      const padR = 16;
      const padT = 16;
      const padB = 30;

      const pw =
        w - padL - padR;

      const ph =
        h - padT - padB;


      // Frame
      ctx.strokeStyle = "#bbb";
      ctx.lineWidth = 1;

      ctx.strokeRect(
        padL,
        padT,
        pw,
        ph
      );


      // Text settings
      ctx.fillStyle = "#666";

      ctx.font =
        "12px system-ui, sans-serif";


      // No data yet
      if (data.length < 2) {

        ctx.fillText(
          "Waiting for BLE notifications...",
          padL + 10,
          padT + 20
        );

        return;

      }


      // ==========================================================
      // Time window
      // ==========================================================

      const tMax =
        data[data.length - 1].t;

      const tMin =
        Math.max(
          0,
          tMax - KEEP_SECONDS
        );


      // ==========================================================
      // Determine raw-value range
      // ==========================================================

      let yMin = Infinity;
      let yMax = -Infinity;

      for (const point of data) {

        if (point.t < tMin) {
          continue;
        }

        yMin =
          Math.min(
            yMin,
            point.y
          );

        yMax =
          Math.max(
            yMax,
            point.y
          );

      }


      if (
        !Number.isFinite(yMin) ||
        !Number.isFinite(yMax)
      ) {
        return;
      }


      // ==========================================================
      // Add Y-axis padding
      // ==========================================================

      let yRange =
        yMax - yMin;


      if (yRange === 0) {

        // Prevent zero-height scale
        yMin -= 1;
        yMax += 1;

      } else {

        const yPad =
          Math.max(
            1,
            yRange * 0.10
          );

        yMin -= yPad;
        yMax += yPad;

      }


      // ==========================================================
      // Coordinate conversion
      // ==========================================================

      const xRange =
        Math.max(
          0.001,
          tMax - tMin
        );


      const xToPx = (t) => {

        return (
          padL +
          ((t - tMin) / xRange) * pw
        );

      };


      const yToPx = (y) => {

        return (
          padT +
          (
            1 -
            (y - yMin) /
            (yMax - yMin)
          ) *
          ph
        );

      };


      // ==========================================================
      // Y-axis grid
      // ==========================================================

      const yTicks = 5;

      ctx.strokeStyle = "#e0e0e0";
      ctx.fillStyle = "#666";


      for (
        let i = 0;
        i <= yTicks;
        i++
      ) {

        const yValue =
          yMin +
          (i / yTicks) *
          (yMax - yMin);


        const py =
          yToPx(yValue);


        // Grid line
        ctx.beginPath();

        ctx.moveTo(
          padL,
          py
        );

        ctx.lineTo(
          padL + pw,
          py
        );

        ctx.stroke();


        // Raw integer axis label
        ctx.fillText(
          Math.round(yValue).toString(),
          5,
          py + 4
        );

      }


      // ==========================================================
      // X-axis grid
      // ==========================================================

      const xTicks = 5;


      for (
        let i = 0;
        i <= xTicks;
        i++
      ) {

        const t =
          tMin +
          (i / xTicks) *
          (tMax - tMin);


        const px =
          xToPx(t);


        ctx.beginPath();

        ctx.moveTo(
          px,
          padT
        );

        ctx.lineTo(
          px,
          padT + ph
        );

        ctx.stroke();


        const secondsAgo =
          Math.round(
            tMax - t
          );


        ctx.fillText(
          `${secondsAgo}s`,
          px - 10,
          padT + ph + 20
        );

      }


      // ==========================================================
      // Plot raw uint16 values
      // ==========================================================

      ctx.strokeStyle = "#111";
      ctx.lineWidth = 2;

      ctx.beginPath();


      let started = false;


      for (const point of data) {

        if (point.t < tMin) {
          continue;
        }


        const px =
          xToPx(point.t);

        const py =
          yToPx(point.y);


        if (!started) {

          ctx.moveTo(
            px,
            py
          );

          started = true;

        } else {

          ctx.lineTo(
            px,
            py
          );

        }

      }


      ctx.stroke();


      // ==========================================================
      // Latest point marker
      // ==========================================================

      const last =
        data[data.length - 1];


      if (last.t >= tMin) {

        ctx.fillStyle = "#111";

        ctx.beginPath();

        ctx.arc(
          xToPx(last.t),
          yToPx(last.y),
          4,
          0,
          Math.PI * 2
        );

        ctx.fill();

      }

    }


    // ============================================================
    // Add data point
    // ============================================================

    function pushPoint(rawValue) {

      if (t0 === null) {

        t0 =
          performance.now();

      }


      const t =
        (
          performance.now() -
          t0
        ) / 1000;


      data.push({

        t: t,

        y: rawValue

      });


      // Trim data older than plot window
      const cutoff =
        t -
        KEEP_SECONDS -
        5;


      while (
        data.length > 0 &&
        data[0].t < cutoff
      ) {

        data.shift();

      }


      numPointsEl.textContent =
        String(data.length);


      drawPlot();

    }


    // ============================================================
    // Process BLE packet
    // ============================================================

    function processBLEValue(dataView) {

  const rawValue =
    parseRawUint16(dataView);

  rawValueEl.textContent =
    String(rawValue);

  timeEl.textContent =
    nowStr();

  // Plot the actual received uint16
  pushPoint(rawValue);

  console.log(
    "BLE notification:",
    {
      time: nowStr(),
      uint16: rawValue
    }
  );
}


    // ============================================================
    // Clear plot
    // ============================================================

    function clearPlot() {

      data = [];

      t0 = null;


      rawValueEl.textContent =
        "--";

      timeEl.textContent =
        "--";

      numPointsEl.textContent =
        "0";


      drawPlot();

    }


    // ============================================================
    // Connect
    // ============================================================

    async function connect() {

      // Check Web Bluetooth
      if (!navigator.bluetooth) {

        setStatus(
          "Web Bluetooth not available. Use Chrome on Android."
        );

        return;

      }


      // ==========================================================
      // Device selection
      // ==========================================================

      setStatus(
        "Requesting device..."
      );


      device =
        await navigator.bluetooth.requestDevice({

          filters: [
            {
              services: [
                ENV_SVC
              ]
            }
          ],

          optionalServices: [
            ENV_SVC
          ]

        });


      device.addEventListener(
        "gattserverdisconnected",
        onDisconnected
      );


      // ==========================================================
      // GATT connection
      // ==========================================================

      setStatus(
        "Connecting GATT..."
      );


      server =
        await device.gatt.connect();


      // ==========================================================
      // Service
      // ==========================================================

      setStatus(
        "Getting Environmental Sensing service..."
      );


      const service =
        await server.getPrimaryService(
          ENV_SVC
        );


      // ==========================================================
      // Characteristic
      // ==========================================================

      setStatus(
        "Getting Humidity characteristic..."
      );


      humChar =
        await service.getCharacteristic(
          HUM_CHR
        );


      // ==========================================================
      // Optional initial read
      // ==========================================================

      try {

        const value =
          await humChar.readValue();


        const rawValue =
          parseRawUint16(value);


        rawValueEl.textContent =
          String(rawValue);

       

        timeEl.textContent =
          nowStr();


        console.log(
          "Initial read:",
          {
            bytes: rawBytes,
            uint16: rawValue
          }
        );

      } catch (error) {

        console.warn(
          "Initial read failed:",
          error
        );

      }


      // ==========================================================
      // Notifications
      // ==========================================================

      setStatus(
        "Starting notifications..."
      );


      await humChar.startNotifications();


      notificationHandler =
        function (event) {

          const dataView =
            event.target.value;


          processBLEValue(
            dataView
          );

        };


      humChar.addEventListener(
        "characteristicvaluechanged",
        notificationHandler
      );


      // ==========================================================
      // UI state
      // ==========================================================

      btnConnect.disabled =
        true;

      btnDisconnect.disabled =
        false;

      btnClear.disabled =
        false;


      setStatus(
        `Connected to ${
          device.name || "device"
        }.`
      );

    }


    // ============================================================
    // Disconnect handler
    // ============================================================

    function onDisconnected() {

      setStatus(
        "Disconnected."
      );


      btnConnect.disabled =
        false;

      btnDisconnect.disabled =
        true;

    }


    // ============================================================
    // Manual disconnect
    // ============================================================

    async function disconnect() {

      try {

        if (humChar) {

          // Remove notification listener
          if (notificationHandler) {

            humChar.removeEventListener(
              "characteristicvaluechanged",
              notificationHandler
            );

          }


          // Stop notifications
          try {

            await humChar.stopNotifications();

          } catch (error) {

            console.warn(
              "Could not stop notifications:",
              error
            );

          }

        }


        // Disconnect GATT
        if (
          device &&
          device.gatt &&
          device.gatt.connected
        ) {

          device.gatt.disconnect();

        }

      } finally {

        device = null;
        server = null;
        humChar = null;
        notificationHandler = null;


        onDisconnected();

      }

    }


    // ============================================================
    // Button handlers
    // ============================================================

    btnConnect.addEventListener(
      "click",
      async () => {

        try {

          await connect();

        } catch (error) {

          console.error(error);

          setStatus(
            `Failed: ${
              error.message || error
            }`
          );

        }

      }
    );


    btnDisconnect.addEventListener(
      "click",
      async () => {

        await disconnect();

      }
    );


    btnClear.addEventListener(
      "click",
      () => {

        clearPlot();

      }
    );


    // ============================================================
    // Initial canvas
    // ============================================================

    resizeCanvas();

  </script>

</body>

</html>
